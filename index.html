<main><section class="hero wrap"><div><div class="eyebrow" data-en="A relational design toolkit · By Peng Lu" data-zh="关系设计工具 · Peng Lu"></div><h1 data-en="A language for<br>the relations<br><em>we experience.</em>" data-zh="用卡牌表达<br>我们体验的<br><em>人–技术关系。</em>"></h1><p class="intro" data-en="Who is this technology to you? Combine roles and qualities to explore human–technology relations in the situations that give them meaning." data-zh="这项技术对你而言像谁？组合角色与关系特质，在赋予它们意义的具体情境中，探索人与技术的关系。"></p><div class="actions"><a class="linkbtn" href="#workspace" data-en="Explore the deckboard ↗" data-zh="开始探索卡牌盘 ↗"></a><button id="hero-demo" data-en="Try an example" data-zh="体验示例"></button></div></div><div class="hero-art" aria-label="How and Who example cards"><div class="halo"></div><div class="hero-card card" id="hero-how"></div><div class="hero-card card who" id="hero-who"></div><div class="art-note" data-en="HOW + WHO → A situated relational narrative" data-zh="怎么样 + 是谁 → 情境中的关系叙述"></div></div></section>
<section class="section wrap" id="guide"><div class="eyebrow" data-en="01 / The approach" data-zh="01 / 使用方法"></div><h2 data-en="Two decks. A place to begin." data-zh="两组卡牌，一个表达的起点。"></h2><div class="steps"><div class="step"><span>01</span><b data-en="Situate the relation" data-zh="明确关系的情境"></b><p data-en="Start with a person, a technology and a particular situation. Their relation takes shape here." data-zh="从一个人、一项技术与具体情境出发，关系在其中形成。"></p></div><div class="step"><span>02</span><b data-en="Find your How + Who" data-zh="选择「怎么样 + 是谁」"></b><p data-en="Pair a red quality card with a blue role card. Add your own words whenever the deck falls short." data-zh="将红色特质卡与蓝色角色卡配对。已有卡牌难以表达时，创建自己的卡牌。"></p></div><div class="step"><span>03</span><b data-en="Tell the story" data-zh="讲述关系背后的故事"></b><p data-en="Articulate expectations and lived experiences in work, learning, everyday life or other practices. Explore what the comparison opens up for design." data-zh="表达工作、学习、日常生活或其他实践中的期待与实际体验，通过对照探索设计可能性。"></p></div></div></section>
<section class="section workspace wrap" id="workspace"><div class="print-head"><h2>Thing-sona · <span id="print-title"></span></h2><p data-en="Peng Lu · Situated human–technology relations" data-zh="Peng Lu · 情境化人–技术关系"></p></div><div class="section-title"><div><div class="eyebrow" data-en="02 / Interactive deckboard" data-zh="02 / 交互卡牌盘"></div><h2 data-en="Give the relation a voice." data-zh="让关系获得表达。"></h2></div><p data-en="Click to select, or drag a card into a matching slot. Explore the relation in the context of a particular person, technology and practice." data-zh="点击选卡，或直接拖拽到对应框中。在具体的人、技术与实践情境中，探索关系。"></p></div>
<div class="toolbar"><select id="projects" aria-label="Saved projects"></select><button id="new" data-en="＋ New" data-zh="＋ 新建"></button><button id="demo" data-en="Show me the example" data-zh="查看示例"></button><button id="export" data-en="Export JSON ↓" data-zh="导出 JSON ↓"></button><button id="import" data-en="Import ↑" data-zh="导入 ↑"></button><button id="print" data-en="Print / PDF" data-zh="打印 / PDF"></button><button id="delete" data-en="Delete" data-zh="删除"></button><span class="save-status" id="save-status" role="status"></span><input hidden type="file" accept="application/json,.json" id="file"></div>

function renderBoards(){ $('#boards').innerHTML=['expected','experienced'].map(side=>{const p=current().pairs[side],how=card(p.how),who=card(p.who);const title=side==='expected'?tr('Expected relation','期望关系'):tr('Experienced relation','实际体验关系');let phrase=[how,who].filter(Boolean).map(c=>lang==='zh'?c.zh:c.en).join(lang==='zh'?'':' ');return `<article class="board ${target===side?'active':''}" data-side="${side}"><div class="board-title"><h3>${title}</h3><button data-target="${side}" aria-pressed="${target===side}">${target===side?tr('● Selecting','● 正在选择'):tr('Select side','选择此侧')}</button></div><p class="board-sub">${side==='expected'?tr('How would you like it to relate to you?','你希望它与你建立怎样的关系？'):tr('How does the relation actually feel?','你实际感受到的是怎样的关系？')}</p><div class="slots">${['how','who'].map(type=>{const c=card(p[type]);return `<div class="slot" data-drop-side="${side}" data-drop-type="${type}">${c?`<button class="card ${type}" data-slot="${side}:${type}" aria-label="${esc(tr('Change '+type,type==='how'?'更换怎么样卡牌':'更换是谁卡牌'))}">${cardHTML(c)}</button><button class="remove" data-remove="${side}:${type}" aria-label="${tr('Remove card','移除卡牌')}">×</button>`:`<button class="empty ${type}" data-slot="${side}:${type}"><b>${type==='how'?tr('How','怎么样'):tr('Who','是谁')}</b><span>＋</span><small>${tr('Click or drop a card','点击或拖入卡牌')}</small></button>`}</div>`}).join('')}</div><div class="phrase">${esc(phrase||tr('A relation, in your words.','用你的词语，表达关系。'))}</div><label>${tr('The story behind the cards','卡牌背后的故事')}<textarea data-note="${side}" maxlength="20000" placeholder="${tr('What happened? What does this pairing mean to you?','发生了什么？这个组合对你意味着什么？')}">${esc(current().notes[side])}</textarea></label></article>`;}).join('');}

function validate(p){if(!p||typeof p!=='object'||typeof p.id!=='string'||p.id.length>100)throw Error();for(const k of ['title','technology','participant','context','reflection'])if(typeof p[k]!=='string'||p[k].length>20000)throw Error();if(!Array.isArray(p.custom)||p.custom.length>200||!p.notes||!p.pairs||!p.details||typeof p.details!=='object')throw Error();const ids=new Set(CARDS.map(c=>c.id));for(const c of p.custom){if(!c||!['how','who'].includes(c.type)||typeof c.id!=='string'||ids.has(c.id))throw Error();for(const k of ['en','zh','de','dz'])if(typeof c[k]!=='string'||c[k].length>500)throw Error();if(c.emoji!==undefined&&c.emoji!==null&&typeof c.emoji!=='string')throw Error();if(c.emoji&&!NOTO.some(n=>n.id===c.emoji))throw Error();c.custom=true;ids.add(c.id);}for(const side of ['expected','experienced']){if(typeof p.notes[side]!=='string'||p.notes[side].length>20000||!p.pairs[side])throw Error();for(const type of ['how','who']){const id=p.pairs[side][type];if(id!==null&&![...CARDS,...p.custom].some(c=>c.id===id&&c.type===type))throw Error();}}for(const val of Object.values(p.details))if(typeof val!=='string'||val.length>500)throw Error();}

let pageScrollLock=null;
function lockPageScroll(){
 if(pageScrollLock)return;
 const root=document.documentElement,body=document.body;
 pageScrollLock={x:window.scrollX,y:window.scrollY,bodyCSS:body.style.cssText,rootOverflow:root.style.overflow,rootBehavior:root.style.scrollBehavior};
 const gutter=Math.max(0,window.innerWidth-root.clientWidth);
 const padding=parseFloat(window.getComputedStyle(body).paddingRight)||0;
 root.style.overflow='hidden';
 Object.assign(body.style,{position:'fixed',top:`-${pageScrollLock.y}px`,left:`-${pageScrollLock.x}px`,width:'100%',overflow:'hidden',paddingRight:`${padding+gutter}px`});
}
function unlockPageScroll(){
 if(!pageScrollLock)return;
 const saved=pageScrollLock,root=document.documentElement;
 pageScrollLock=null;
 document.body.style.cssText=saved.bodyCSS;
 root.style.overflow=saved.rootOverflow;
 root.style.scrollBehavior='auto';
 window.scrollTo({left:saved.x,top:saved.y,behavior:'instant'});
 root.style.scrollBehavior=saved.rootBehavior;
}
$('#custom-dialog').addEventListener('close',unlockPageScroll);
function openCustom(id=null){if(!id&&current().custom.length>=200){notify(tr('This project already has 200 custom cards. Remove one before adding another.','当前项目已有 200 张自定义卡牌，请先删除一张再添加。'));return;}editingId=id;const c=id?current().custom.find(c=>c.id===id):null;if(id&&!c)return;$('#custom-form').reset();$('#custom-type').value=c?c.type:tab;$('#custom-type').disabled=!!c;$('#custom-title').value=c?(lang==='zh'?c.zh:c.en):'';$('#custom-description').value=c?(lang==='zh'?c.dz:c.de):'';selectedEmoji=c?c.emoji||null:'1f916';$('#custom-heading').textContent=c?tr('Edit your card.','编辑你的卡牌。'):tr('Make room for your words.','加入你自己的表达。');$('#custom-submit').textContent=c?tr('Save changes','保存修改'):tr('Add & use card','添加并使用');$('#emoji-search').value='';$('#emoji-search').placeholder=tr('Search illustrations…','搜索插图…');$('#emoji-category').innerHTML=[['all','All illustrations','全部插图'],['feelings','Faces & emotion','表情与情绪'],['people','People & gestures','人物与手势'],['nature','Animals & nature','动物与自然'],['food','Food & drink','食物与饮品'],['places','Travel & places','交通与场所'],['activities','Activities & play','活动与娱乐'],['objects','Objects & tools','物品与工具'],['symbols','Symbols','符号']].map(([v,en,zh])=>`<option value="${v}">${tr(en,zh)}</option>`).join('');renderEmoji();previewCustom();lockPageScroll();$('#custom-dialog').showModal();$('#custom-title').focus({preventScroll:true});}
function previewCustom(){const c={type:$('#custom-type').value,en:$('#custom-title').value||tr('Your card','你的卡牌'),zh:$('#custom-title').value||tr('Your card','你的卡牌'),de:$('#custom-description').value||tr('Your meaning, in context.','它在情境中的意义。'),dz:$('#custom-description').value||tr('Your meaning, in context.','它在情境中的意义。'),custom:true,emoji:selectedEmoji};$('#custom-preview').className='card custom-preview '+c.type;$('#custom-preview').innerHTML=cardHTML(c);}
function renderEmoji(reset=true){if(reset){emojiLimit=80;$('#emoji-grid').scrollTop=0;}const q=$('#emoji-search').value.trim().toLowerCase(),cat=$('#emoji-category').value;const list=NOTO.filter(n=>(cat==='all'||n.category===cat)&&[n.en,n.zh,n.tags||'',n.id].join(' ').toLowerCase().includes(q));const shown=list.slice(0,emojiLimit);$('#emoji-results').textContent=tr(`${shown.length} of ${list.length} illustrations · ${NOTO.length} in the library`,`${list.length} 个结果，已显示 ${shown.length} 个 · 素材库共 ${NOTO.length} 个`);$('#emoji-grid').innerHTML=shown.map(n=>`<button type="button" class="emoji-choice ${n.id===selectedEmoji?'selected':''}" data-emoji="${n.id}" aria-label="${esc(tr(n.en,n.zh))}" title="${esc(tr(n.en,n.zh))}" aria-pressed="${n.id===selectedEmoji}"><img src="assets/noto/${n.id}.svg" alt="" loading="lazy"></button>`).join('')||`<span class="no-cards">${tr('No illustrations found. Try another word or category.','没有找到插图，请尝试其他关键词或分类。')}</span>`;$('#emoji-more').hidden=shown.length>=list.length;$('#emoji-more').textContent=tr('Show more illustrations','显示更多插图');}
$('#emoji-more').onclick=()=>{emojiLimit+=80;renderEmoji(false);};

$('#emoji-search').oninput=renderEmoji;$('#emoji-category').onchange=renderEmoji;$('#emoji-grid').addEventListener('click',e=>{const b=e.target.closest('[data-emoji]');if(b){selectedEmoji=b.dataset.emoji;const pos=$('#emoji-grid').scrollTop;renderEmoji(false);$('#emoji-grid').scrollTop=pos;previewCustom();}});['#custom-title','#custom-description'].forEach(id=>$(id).oninput=previewCustom);$('#custom-type').onchange=previewCustom;
function deleteCustom(id){const c=current().custom.find(c=>c.id===id);if(!c)return;const used=['expected','experienced'].filter(side=>current().pairs[side][c.type]===id).length;const message=tr('Delete this custom card from the current project?','从当前项目删除这张自定义卡牌？')+(used?tr(` It is used in ${used} slot(s); those slots will be cleared. Your narratives will be kept.`,` 它已用于 ${used} 个卡位，相关卡位将清空，叙述文字会保留。`):'');if(!confirm(message))return;current().custom=current().custom.filter(x=>x.id!==id);for(const side of ['expected','experienced'])if(current().pairs[side][c.type]===id)current().pairs[side][c.type]=null;save();renderDeck();renderBoards();notify(tr('Custom card deleted.','自定义卡牌已删除。'));}
$('#custom-form').onsubmit=e=>{e.preventDefault();const name=$('#custom-title').value.trim(),description=$('#custom-description').value.trim();if(!name||!description)return;if(editingId){const c=current().custom.find(c=>c.id===editingId);if(!c)return;Object.assign(c,{en:name,zh:name,de:description,dz:description,emoji:selectedEmoji});save();renderDeck();renderBoards();notify(tr('Card updated.','卡牌已更新。'));}else{const c={id:uid(),type:$('#custom-type').value,en:name,zh:name,de:description,dz:description,custom:true,emoji:selectedEmoji};current().custom.push(c);tab=c.type;choose(c.id);renderDeck();}$('#custom-dialog').close();editingId=null;};$('#cancel').onclick=()=>$('#custom-dialog').close();

$('#export').onclick=()=>{const a=document.createElement('a');const blob=new Blob([JSON.stringify({format:'thing-sona',version:1,project:current()},null,2)],{type:'application/json'});a.href=URL.createObjectURL(blob);a.download=(current().title||'thing-sona').replace(/[^\p{L}\p{N}_-]/gu,'_').slice(0,80)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);};
$('#import').onclick=()=>$('#file').click();$('#file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw Error();const v=JSON.parse(await f.text());if(v.format!=='thing-sona'||v.version!==1)throw Error();validate(v.project);v.project.id=uid();newProject(v.project);notify(tr('Project imported.','项目已导入。'));}catch(err){notify(tr('Import failed: choose a valid Thing-sona v1 JSON file (under 2 MB).','导入失败：请选择有效的 Thing-sona v1 JSON 文件（小于 2 MB）。'));}e.target.value='';};
$('#print').onclick=()=>{document.querySelectorAll('textarea').forEach(t=>{t.dataset.height=t.style.height;t.style.height=t.scrollHeight+'px';});window.print();};window.addEventListener('afterprint',()=>document.querySelectorAll('textarea').forEach(t=>{t.style.height=t.dataset.height||'';}));
render();save();
</script></body></html>
